<!-- register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <form action="register.jsp" method="post">
            <h1>Register</h1>
            <div class="icons">
                <a href="#" class="icon"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-twitter"></i></a>
                <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
            </div>
            <input type="text" name="r1" placeholder="Name" required>
            <input type="email" name="r2" placeholder="Email" required>
            <input type="password" name="r3" placeholder="Password" required>
            <input type="password" name="r4" placeholder="Confirm Password" required>
            <input type="number" name="r5" placeholder="Age" required>
            <label>DOB:</label>
            <input type="date" name="dob" required>
            <label>Gender:</label>
<div class="gender">
    <input type="radio" name="gender" value="male" id="male" required>
    <label for="male">Male</label>

    <input type="radio" name="gender" value="female" id="female" required>
    <label for="female">Female</label>

    <input type="radio" name="gender" value="other" id="other" required>
    <label for="other">Other</label>
</div>

            <button type="submit">Register</button>
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </div>
</body>
</html>
