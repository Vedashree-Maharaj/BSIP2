<!DOCTYPE html>
<html lang="en">
<head>
    <title>GlowGlam - Shopping Cart</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        body {
            padding-top: 50px;
            background-color: rgb(236, 235, 245);
        }
        .cart-container {
            width: 80%;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .cart-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .cart-table {
            width: 100%;
        }
        .cart-table th, .cart-table td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        .cart-table th {
            background-color: #ff6f61;
            color: white;
        }
        .remove-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .remove-btn:hover {
            background-color: darkred;
        }
        .total-price {
            font-size: 20px;
            font-weight: bold;
            text-align: right;
            margin-top: 20px;
        }
        .checkout-btn {
            width: 100%;
            padding: 10px;
            font-size: 18px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 10px;
        }
        .checkout-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container cart-container">
    <div class="cart-title">Shopping Cart</div>
    <table class="cart-table">
        <thead>
            <tr>
                <th>Product</th>
                <th>Price (₹)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cartItems">
            <!-- Cart items will be displayed here -->
        </tbody>
    </table>
    <div class="total-price">Total: ₹<span id="totalPrice">0</span></div>
    <button class="checkout-btn" onclick="proceedToPayment()">Proceed to Payment</button>
</div>

<script>
    function loadCart() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let cartItems = document.getElementById("cartItems");
        let totalPrice = 0;
        cartItems.innerHTML = "";

        cart.forEach((item, index) => {
            totalPrice += item.price;
            cartItems.innerHTML += `
                <tr>
                    <td>${item.name}</td>
                    <td>₹${item.price}</td>
                    <td><button class="remove-btn" onclick="removeItem(${index})">Remove</button></td>
                </tr>
            `;
        });

        document.getElementById("totalPrice").innerText = totalPrice;
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        cart.splice(index, 1);
        localStorage.setItem("cart", JSON.stringify(cart));
        loadCart();  // Reload the cart after removal
    }

    function proceedToPayment() {
        if (JSON.parse(localStorage.getItem("cart"))?.length === 0) {
            alert("Your cart is empty!");
        } else {
            window.location.href = "payment.html";
        }
    }

    loadCart();
</script>

</body>
</html>
