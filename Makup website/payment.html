<!DOCTYPE html>
<html lang="en">
<head>
    <title>GlowGlam - Payment</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <style>
        body {
            padding-top: 50px;
            background-color: rgb(236, 235, 245);
        }
        .payment-container {
            width: 50%;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }
        .payment-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .total-price {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            color: #ff6f61;
        }
        .payment-method {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
        .payment-option {
            margin: 10px 0;
        }
        .pay-btn {
            width: 100%;
            padding: 10px;
            font-size: 18px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            margin-top: 20px;
        }
        .pay-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="container payment-container">
    <div class="payment-title">Payment</div>
    <div class="total-price">Total Amount: ₹<span id="totalAmount">0</span></div>

    <div class="payment-method">Select Payment Method:</div>
    <label class="payment-option"><input type="radio" name="payment" value="Credit Card"> Credit Card/Debit Card</label><br>
    <label class="payment-option"><input type="radio" name="payment" value="UPI"> UPI (Google Pay, PhonePe, Paytm)</label><br>
    <label class="payment-option"><input type="radio" name="payment" value="COD"> Cash on Delivery</label><br>

    <button class="pay-btn" onclick="confirmPayment()">Confirm Payment</button>
</div>

<script>
    function loadTotalAmount() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        let total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById("totalAmount").innerText = total;
    }

    function confirmPayment() {
        let selectedPayment = document.querySelector('input[name="payment"]:checked');

        if (!selectedPayment) {
            alert("Please select a payment method!");
            return;
        }

        alert("Payment Successful! Your order has been placed.");
        localStorage.removeItem("cart"); // Clear the cart after payment
        window.location.href = "index.html"; // Redirect to home page
    }

    loadTotalAmount();
</script>

</body>
</html>
