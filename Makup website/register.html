<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            height: 100vh;
        }
        .form-container {
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #ffffff;
            width:400px;
            padding: 30px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            color: #4CAF50;
        }
        label {
            font-size: 14px;
            color: #333;
        }
        input {
            padding: 10px;
            margin-bottom: 15px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        input:focus {
            border-color: #4CAF50;
        }
        button {
            background-color: #4CAF50;
            border-radius: 5px;
            width: 100%;
            padding: 12px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #45a049;
        }
        .social-login-icons {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }
        .social-login-icons i {
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .social-login-icons i:hover {
            transform: scale(1.1);
        }
        .social-login-icons .google {
            color: #db4437;
        }
        .social-login-icons .facebook {
            color: #3b5998;
        }
        .social-login-icons .twitter {
            color: #1da1f2;
        }
        .error {
            color: red;
            font-size: 12px;
            margin-bottom: 15px;
        }
        .form-container p {
            font-size: 14px;
            color: #333;
            text-align: center;
        }
        .form-container p a {
            color: #4CAF50;
            text-decoration: none;
        }
        .form-container p a:hover {
            text-decoration: underline;
        }
        .or-continue {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="form-container">
       
        <form action="register.jsp" method="post">
            <h2>Registration Form</h2>

            <label for="fullname">Full Name:</label>
            <input type="text" name="r1" placeholder="Enter your full name" required>

            <label for="email">Email:</label>
            <input type="email" name="r2" placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" name="r3"  placeholder="Enter your password" required>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" name=r4  placeholder="Confirm your password" required>

            <div id="error-message" class="error"></div>

            <button type="submit">Register</button>

            <div class="or-continue">
                <span>Or Continue with:</span>
            </div>

            <div class="social-login-icons">
                <i class="fab fa-google google"></i>
                <i class="fab fa-facebook-f facebook"></i>
                <i class="fab fa-twitter twitter"></i>
            </div>
            <br><br>

            <p>Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </div>


</body>
</html>
